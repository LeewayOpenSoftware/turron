[package]
name = "rdbridge"
version = "0.1.0"
edition = "2021"
description = "Backend de xdg-desktop-portal que aprueba sin dialogo a RustDesk usando la API privada de Mutter"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
serde = "1.0.229"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
